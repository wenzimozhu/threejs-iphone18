<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>产品展示 · 3D 手机</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 110% at 50% -10%, #1e2a4d 0%, #0d1220 42%, #05070c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf5;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .ui { position: fixed; pointer-events: none; user-select: none; }

  .headline {
    top: clamp(24px, 5vh, 56px); left: 0; right: 0; text-align: center;
    opacity: 0; animation: fadeUp 1.2s 0.35s ease forwards;
  }
  .headline h1 {
    font-size: clamp(20px, 4vw, 38px);
    font-weight: 700; letter-spacing: 0.14em;
    background: linear-gradient(100deg, #ffffff 10%, #9fb6ff 50%, #ffffff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(100, 150, 255, 0.55));
  }
  .headline p {
    margin-top: 10px; font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.32em; color: rgba(180, 196, 226, 0.62);
  }

  .hint {
    bottom: clamp(20px, 4vh, 40px); left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: 0.18em; color: rgba(170, 186, 216, 0.5);
    opacity: 0; animation: fadeUp 1s 1.2s ease forwards;
    transition: opacity .6s ease;
  }

  .vignette {
    inset: 0;
    background: radial-gradient(90% 75% at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
  }

  #toast {
    position: fixed; left: 50%; bottom: 86px;
    transform: translate(-50%, 12px);
    padding: 9px 22px; border-radius: 999px;
    font-size: 13px; letter-spacing: 0.14em; color: #dfe8ff;
    background: rgba(30, 42, 72, 0.75);
    border: 1px solid rgba(130, 165, 255, 0.3);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity .25s ease, transform .25s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: rgba(6, 9, 16, 0.94);
    transition: opacity .6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(140, 170, 255, 0.18);
    border-top-color: #7ea4ff;
    animation: spin 0.9s linear infinite;
  }
  .loading-text { font-size: 13px; letter-spacing: 0.2em; color: rgba(185, 200, 232, 0.8); }

  #uploadBtn {
    position: fixed; right: 20px; bottom: 20px; z-index: 30;
    padding: 10px 20px; border-radius: 999px;
    border: 1px solid rgba(140, 170, 255, 0.28);
    background: rgba(30, 42, 72, 0.55);
    color: #cdd9f5; font-size: 12px; letter-spacing: 0.1em;
    cursor: pointer; backdrop-filter: blur(8px);
    transition: all .2s ease;
    font-family: inherit;
  }
  #uploadBtn:hover {
    background: rgba(52, 74, 128, 0.8);
    border-color: rgba(160, 190, 255, 0.6);
    color: #fff;
  }

  #srcTag {
    position: fixed; left: 20px; bottom: 22px; z-index: 30;
    font-size: 11px; letter-spacing: 0.12em;
    color: rgba(170, 186, 216, 0.6);
    pointer-events: none;
  }

  /* 致命错误提示 */
  #fatalError {
    position: fixed; inset: 0; z-index: 999;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10, 6, 10, 0.96);
    padding: 40px; text-align: center;
  }
  #fatalError.show { display: flex; }
  #fatalError h2 {
    font-size: 18px; color: #ff8a8a; margin-bottom: 16px;
    letter-spacing: 0.1em; font-weight: 600;
  }
  #fatalError pre {
    max-width: 720px; max-height: 50vh; overflow: auto;
    font-size: 12px; line-height: 1.7; color: #d6c0c0;
    background: rgba(255, 120, 120, 0.06);
    border: 1px solid rgba(255, 120, 120, 0.2);
    padding: 18px; border-radius: 8px;
    text-align: left; white-space: pre-wrap; word-break: break-all;
  }
  #fatalError p {
    margin-top: 18px; font-size: 12px; color: rgba(200, 190, 190, 0.6);
    line-height: 1.9;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<!-- 全局错误捕获：任何脚本/模块异常都直接显示在页面上 -->
<script>
  (function () {
    function showFatal(msg) {
      var box = document.getElementById('fatalError');
      var txt = document.getElementById('fatalErrorText');
      if (!box || !txt) return;
      txt.textContent = String(msg || '未知错误');
      box.classList.add('show');
    }
    window.addEventListener('error', function (e) {
      if (e && e.message) showFatal(e.message + '\n' + (e.filename || ''));
      else if (e && e.target && e.target.tagName === 'SCRIPT') showFatal('脚本加载失败：' + e.target.src);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      showFatal((r && (r.message || r)) || 'Promise rejection');
    });
    window.__showFatal = showFatal;
  })();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================================
   配置
   ============================================================================ */
const CONFIG = {
  modelUrl: './model.glb',          // 有就加载，没有就用内置演示手机
  screenName: '',
  screenKeywords: ['screen', 'display', 'lcd', 'oled', 'panel', 'monitor', '屏幕', '屏'],
  targetHeight: 6.6,
  startLit: true,
  useFallbackWallpaper: true,
  boostScreen: true,
  exposure: 1.12,
  environmentIntensity: 1.35,
  bloomStrength: 0.45,
  bloomRadius: 0.5,
  bloomThreshold: 0.92,
  maxPixelRatio: 1.75,
};

/* ---------------------------------------------------------------
   渲染器 / 场景 / 相机
   --------------------------------------------------------------- */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(4, 2, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.7;
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI * 0.72;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

/* ---------------------------------------------------------------
   环境光照（程序化科技影棚）
   --------------------------------------------------------------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

function createStudioEnvTexture() {
  const W = 2048, H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const base = ctx.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0.00, '#43547c');
  base.addColorStop(0.28, '#1c2542');
  base.addColorStop(0.58, '#0b1120');
  base.addColorStop(1.00, '#04060c');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);

  const top = ctx.createRadialGradient(W * 0.5, -H * 0.02, 0, W * 0.5, -H * 0.02, W * 0.46);
  top.addColorStop(0.00, 'rgba(240,247,255,1)');
  top.addColorStop(0.32, 'rgba(150,185,255,0.70)');
  top.addColorStop(0.68, 'rgba(60,95,190,0.22)');
  top.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, W, H * 0.75);

  function strip(cx, hw, y0, y1, color, blur) {
    ctx.save();
    try { ctx.filter = `blur(${blur}px)`; } catch (e) {}
    ctx.fillStyle = color;
    const x = cx * W, halfW = hw * W;
    ctx.fillRect(x - halfW, y0 * H, halfW * 2, (y1 - y0) * H);
    ctx.restore();
  }

  strip(0.17, 0.050, 0.10, 0.92, 'rgba(200,222,255,0.95)', 34);
  strip(0.30, 0.026, 0.16, 0.88, 'rgba(255,255,255,0.90)', 22);
  strip(0.71, 0.026, 0.16, 0.88, 'rgba(255,255,255,0.90)', 22);
  strip(0.85, 0.050, 0.10, 0.92, 'rgba(165,200,255,0.95)', 34);
  strip(0.46, 0.018, 0.25, 0.82, 'rgba(80,170,255,0.55)', 18);
  strip(0.60, 0.018, 0.30, 0.86, 'rgba(170,105,255,0.45)', 18);

  const bot = ctx.createLinearGradient(0, H * 0.72, 0, H);
  bot.addColorStop(0, 'rgba(0,0,0,0)');
  bot.addColorStop(1, 'rgba(45,85,185,0.30)');
  ctx.fillStyle = bot;
  ctx.fillRect(0, H * 0.72, W, H * 0.28);

  const tex = new THREE.CanvasTexture(canvas);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const studioTex = createStudioEnvTexture();
const envRT = pmrem.fromEquirectangular(studioTex);
studioTex.dispose();
scene.environment = envRT.texture;
scene.environmentIntensity = CONFIG.environmentIntensity;

scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x0a0e18, 0.65));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.9);
keyLight.position.set(6, 9, 8);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6f9dff, 1.55);
rimLight.position.set(-8, 4, -7);
scene.add(rimLight);

const warmLight = new THREE.DirectionalLight(0xffb27a, 0.5);
warmLight.position.set(-4, -6, 7);
scene.add(warmLight);

const underLight = new THREE.DirectionalLight(0x3a7bff, 0.45);
underLight.position.set(0, -8, 3);
scene.add(underLight);

/* ---------------------------------------------------------------
   后期处理
   --------------------------------------------------------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  CONFIG.bloomStrength,
  CONFIG.bloomRadius,
  CONFIG.bloomThreshold
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ---------------------------------------------------------------
   程序化壁纸
   --------------------------------------------------------------- */
function createScreenTexture() {
  const W = 640, H = 1380;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0a0f22');
  bg.addColorStop(0.55, '#111a35');
  bg.addColorStop(1, '#060812');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const blobs = [
    [0.20, 0.20, 0.62, 'rgba(70,110,255,0.95)'],
    [0.86, 0.34, 0.55, 'rgba(200,60,190,0.85)'],
    [0.34, 0.60, 0.62, 'rgba(0,200,225,0.62)'],
    [0.76, 0.80, 0.50, 'rgba(255,150,70,0.70)'],
    [0.14, 0.90, 0.46, 'rgba(120,70,255,0.60)'],
  ];
  for (const [bx, by, br, color] of blobs) {
    const cx = bx * W, cy = by * H, rad = br * W;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'screen';
  ctx.lineWidth = 3;
  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = `rgba(255,255,255,${0.30 - i * 0.045})`;
    ctx.beginPath();
    ctx.arc(W * 0.5, H * 0.44, 130 + i * 95, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

let wallpaperTex = null;
function getWallpaper() {
  if (!wallpaperTex) wallpaperTex = createScreenTexture();
  return wallpaperTex;
}

/* ---------------------------------------------------------------
   纹理工具
   --------------------------------------------------------------- */
function createRadialTexture() {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(0,0,0,0.55)');
  g.addColorStop(0.45, 'rgba(0,0,0,0.24)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}

function createGlowTexture() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(120,175,255,0.85)');
  g.addColorStop(0.22, 'rgba(75,130,255,0.42)');
  g.addColorStop(0.55, 'rgba(40,75,190,0.12)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return new THREE.CanvasTexture(c);
}

/* ---------------------------------------------------------------
   地面阴影
   --------------------------------------------------------------- */
const shadowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({
    map: createRadialTexture(),
    transparent: true,
    depthWrite: false,
    opacity: 0.65,
  })
);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.visible = false;
shadowMesh.renderOrder = 1;
scene.add(shadowMesh);

/* ---------------------------------------------------------------
   科技感场景元素
   --------------------------------------------------------------- */
const techGroup = new THREE.Group();
techGroup.visible = false;
scene.add(techGroup);

let floorGlow = null, ring1 = null, ring2 = null, polarGrid = null, particles = null;

{
  floorGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(18, 18),
    new THREE.MeshBasicMaterial({
      map: createGlowTexture(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.5,
    })
  );
  floorGlow.rotation.x = -Math.PI / 2;
  floorGlow.position.y = -0.01;
  floorGlow.renderOrder = 0;
  techGroup.add(floorGlow);

  const makeRing = (inner, outer, color, opacity) => {
    const mesh = new THREE.Mesh(
      new THREE.RingGeometry(inner, outer, 160),
      new THREE.MeshBasicMaterial({
        color, transparent: true, opacity,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.005;
    mesh.renderOrder = 2;
    return mesh;
  };

  ring1 = makeRing(3.55, 3.62, 0x4a8dff, 0.8);
  ring2 = makeRing(4.35, 4.40, 0x2f6bff, 0.42);
  techGroup.add(ring1, ring2);

  polarGrid = new THREE.PolarGridHelper(8, 12, 4, 72, 0x3a6fd8, 0x1b3568);
  polarGrid.position.y = 0;
  polarGrid.renderOrder = 1;
  if (polarGrid.material) {
    polarGrid.material.transparent = true;
    polarGrid.material.opacity = 0.22;
  }
  techGroup.add(polarGrid);
}

{
  const COUNT = 520;
  const positions = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    const r = 5.5 + Math.random() * 9;
    const a = Math.random() * Math.PI * 2;
    positions[i * 3 + 0] = Math.cos(a) * r;
    positions[i * 3 + 1] = -2.5 + Math.random() * 11;
    positions[i * 3 + 2] = Math.sin(a) * r;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  particles = new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      size: 0.05,
      color: 0x8ab4ff,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    })
  );
  scene.add(particles);
}

/* ---------------------------------------------------------------
   内置程序化手机模型（不依赖外部文件）
   --------------------------------------------------------------- */
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  r = Math.min(r, w / 2, h / 2);
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function buildProceduralPhone() {
  const group = new THREE.Group();

  const H = 6.6;
  const W = H * 0.49;
  const D = 0.30;
  const corner = 0.42;

  // 1. 中框
  const bodyShape = roundedRectShape(W, H, corner);
  const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
    depth: D,
    bevelEnabled: true,
    bevelThickness: 0.015,
    bevelSize: 0.015,
    bevelSegments: 3,
    curveSegments: 32,
  });
  bodyGeo.translate(0, 0, -D / 2);
  bodyGeo.computeVertexNormals();

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: 0x8b919c,
    metalness: 1.0,
    roughness: 0.20,
    clearcoat: 0.6,
    clearcoatRoughness: 0.15,
    envMapIntensity: 1.5,
  });
  group.add(new THREE.Mesh(bodyGeo, bodyMat));

  // 2. 屏幕（正面）
  const inset = 0.10;
  const sw = W - inset * 2;
  const sh = H - inset * 2;
  const screenShape = roundedRectShape(sw, sh, corner - inset);
  const screenGeo = new THREE.ShapeGeometry(screenShape, 32);
  {
    const pos = screenGeo.attributes.position;
    const uv = screenGeo.attributes.uv;
    const minX = -sw / 2, minY = -sh / 2;
    for (let i = 0; i < pos.count; i++) {
      uv.setXY(i,
        (pos.getX(i) - minX) / sw,
        (pos.getY(i) - minY) / sh
      );
    }
    uv.needsUpdate = true;
  }
  const wallpaper = getWallpaper();
  const screenMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 1.0,
    map: wallpaper,
    emissiveMap: wallpaper,
    roughness: 0.08,
    metalness: 0.05,
  });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.name = 'Screen';
  screen.position.z = D / 2 + 0.003;
  group.add(screen);

  // 3. 后盖
  const backShape = roundedRectShape(W - 0.03, H - 0.03, corner - 0.02);
  const backGeo = new THREE.ShapeGeometry(backShape, 32);
  const backMat = new THREE.MeshPhysicalMaterial({
    color: 0x171a21,
    metalness: 0.4,
    roughness: 0.42,
    clearcoat: 0.6,
    clearcoatRoughness: 0.18,
    envMapIntensity: 1.0,
    side: THREE.DoubleSide,
  });
  const back = new THREE.Mesh(backGeo, backMat);
  back.position.z = -D / 2 - 0.002;
  group.add(back);

  // 4. 摄像头模组
  const camSize = W * 0.42;
  const camShape = roundedRectShape(camSize, camSize, 0.20);
  const camGeo = new THREE.ExtrudeGeometry(camShape, {
    depth: 0.12,
    bevelEnabled: true,
    bevelThickness: 0.01,
    bevelSize: 0.01,
    bevelSegments: 3,
    curveSegments: 24,
  });
  camGeo.translate(0, 0, -0.12);

  const camMat = new THREE.MeshPhysicalMaterial({
    color: 0x101319,
    metalness: 0.85,
    roughness: 0.28,
    clearcoat: 1.0,
    clearcoatRoughness: 0.06,
    envMapIntensity: 1.6,
  });
  const camGroup = new THREE.Group();
  camGroup.add(new THREE.Mesh(camGeo, camMat));

  const lensRimMat = new THREE.MeshPhysicalMaterial({
    color: 0xc8d0dc,
    metalness: 1.0,
    roughness: 0.12,
    envMapIntensity: 1.8,
  });
  const lensGlassMat = new THREE.MeshPhysicalMaterial({
    color: 0x020508,
    metalness: 0.3,
    roughness: 0.05,
    clearcoat: 1.0,
    clearcoatRoughness: 0.02,
    envMapIntensity: 2.5,
    emissive: 0x0a1520,
    emissiveIntensity: 0.8,
  });

  const lensOffsets = [
    [-camSize * 0.24,  camSize * 0.24],
    [ camSize * 0.24,  camSize * 0.24],
    [-camSize * 0.24, -camSize * 0.24],
  ];
  for (const [lx, ly] of lensOffsets) {
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.05, 48), lensRimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(lx, ly, -0.13);
    camGroup.add(rim);

    const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.04, 48), lensGlassMat);
    lens.rotation.x = Math.PI / 2;
    lens.position.set(lx, ly, -0.15);
    camGroup.add(lens);
  }

  const flash = new THREE.Mesh(
    new THREE.CircleGeometry(0.09, 32),
    new THREE.MeshBasicMaterial({ color: 0xfff2d8, side: THREE.DoubleSide })
  );
  flash.position.set(camSize * 0.24, -camSize * 0.24, -0.13);
  camGroup.add(flash);

  camGroup.position.set(-W * 0.22, H * 0.30, -D / 2);
  group.add(camGroup);

  // 5. 侧键
  const btnMat = new THREE.MeshPhysicalMaterial({
    color: 0x9ca3b0,
    metalness: 1.0,
    roughness: 0.18,
  });
  const power = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.55, 24), btnMat);
  power.position.set(W / 2 + 0.02, 0.7, 0);
  group.add(power);

  const vol1 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 24), btnMat);
  vol1.position.set(-W / 2 - 0.02, 0.9, 0);
  group.add(vol1);
  const vol2 = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 24), btnMat);
  vol2.position.set(-W / 2 - 0.02, 0.3, 0);
  group.add(vol2);

  return group;
}

/* ---------------------------------------------------------------
   模型挂载 / 屏幕识别 / 状态
   --------------------------------------------------------------- */
let modelPivot = null;
let modelRoot = null;
let screenMats = [];
let screenMeshes = [];
let lit = CONFIG.startLit ? 1 : 0;
let litTarget = lit;

function disposeObject(obj) {
  obj.traverse((o) => {
    if (!o.isMesh) return;
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => { if (m) m.dispose(); }); // 共享纹理不 dispose
  });
}

function mountModel(rootObject, label) {
  // 清理旧的
  if (modelPivot) {
    scene.remove(modelPivot);
    disposeObject(modelPivot);
    modelPivot = null;
  }
  modelRoot = rootObject;
  screenMats = [];
  screenMeshes = [];

  // 温和材质整理
  modelRoot.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((mat) => {
      if (!mat) return;
      if (mat.isMeshStandardMaterial || mat.isMeshPhysicalMaterial) {
        if (typeof mat.roughness === 'number') {
          mat.roughness = THREE.MathUtils.clamp(mat.roughness, 0.04, 0.95);
        }
        mat.envMapIntensity = Math.max(mat.envMapIntensity ?? 1, 1.0);
        mat.needsUpdate = true;
      }
    });
  });

  modelPivot = new THREE.Group();
  modelPivot.add(modelRoot);
  scene.add(modelPivot);

  // 缩放
  const box0 = new THREE.Box3().setFromObject(modelRoot);
  const size0 = box0.getSize(new THREE.Vector3());
  const maxDim = Math.max(size0.y, 1e-6);
  const scale = CONFIG.targetHeight / maxDim;
  modelRoot.scale.setScalar(scale);

  // 居中
  const box1 = new THREE.Box3().setFromObject(modelRoot);
  const center1 = box1.getCenter(new THREE.Vector3());
  modelRoot.position.sub(center1);

  // 屏幕识别
  collectScreenMeshes(modelRoot);

  // 相机
  fitCameraToObject(modelPivot);

  // 阴影 & 科技地面
  const box2 = new THREE.Box3().setFromObject(modelPivot);
  const size2 = box2.getSize(new THREE.Vector3());
  const shadowSize = Math.max(size2.x, size2.z) * 2.4;
  shadowMesh.scale.set(shadowSize, shadowSize, 1);
  shadowMesh.position.set(0, box2.min.y - 0.04, 0);
  shadowMesh.visible = true;

  techGroup.position.y = box2.min.y;
  techGroup.visible = true;

  // 屏幕状态
  lit = CONFIG.startLit ? 1 : 0;
  litTarget = lit;
  applyScreenState(lit);

  // 更新左下角标签
  const tag = document.getElementById('srcTag');
  if (tag) tag.textContent = '当前：' + label;
}

function collectScreenMeshes(root) {
  screenMats = [];
  screenMeshes = [];

  const candidates = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const n = (o.name || '').toLowerCase();
    let match = false;
    if (CONFIG.screenName) {
      match = n.includes(CONFIG.screenName.toLowerCase());
    } else {
      match = CONFIG.screenKeywords.some((k) => n.includes(k.toLowerCase()));
    }
    if (match) candidates.push(o);
  });

  if (candidates.length === 0) {
    console.warn('[手机展示] 未识别到屏幕 Mesh，可把屏幕物体名填到 CONFIG.screenName');
    return;
  }

  for (const mesh of candidates) {
    if (!mesh.material) continue;
    screenMeshes.push(mesh);
    if (Array.isArray(mesh.material)) {
      mesh.material = mesh.material.map((m) => (m ? registerScreenMaterial(m) : m));
    } else {
      mesh.material = registerScreenMaterial(mesh.material);
    }
  }
}

function registerScreenMaterial(srcMat) {
  const mat = srcMat.clone();
  const hasEmissive = !!mat.emissive;
  const rec = {
    mat,
    baseColor: mat.color ? mat.color.clone() : new THREE.Color(0xffffff),
    baseEmissive: hasEmissive ? mat.emissive.clone() : null,
    baseEmissiveIntensity:
      typeof mat.emissiveIntensity === 'number' ? mat.emissiveIntensity : 1,
  };

  if (CONFIG.useFallbackWallpaper && !mat.map && hasEmissive) {
    const tex = getWallpaper();
    mat.map = tex;
    mat.emissiveMap = tex;
    mat.emissive.set(0xffffff);
    mat.emissiveIntensity = 1.0;
    mat.needsUpdate = true;
    rec.baseEmissive = new THREE.Color(0xffffff);
    rec.baseEmissiveIntensity = 1.0;
  }

  if (CONFIG.boostScreen && hasEmissive) {
    const isBlack =
      mat.emissive.r < 0.01 && mat.emissive.g < 0.01 && mat.emissive.b < 0.01;
    if (mat.map && !mat.emissiveMap && isBlack) {
      mat.emissiveMap = mat.map;
      mat.emissive.set(0xffffff);
      rec.baseEmissive = new THREE.Color(0xffffff);
      if (rec.baseEmissiveIntensity < 0.8) {
        rec.baseEmissiveIntensity = 1.0;
        mat.emissiveIntensity = 1.0;
      }
      mat.needsUpdate = true;
    } else if (mat.emissiveMap && isBlack) {
      mat.emissive.set(0xffffff);
      rec.baseEmissive = new THREE.Color(0xffffff);
      mat.needsUpdate = true;
    }
  }

  screenMats.push(rec);
  return mat;
}

function applyScreenState(l) {
  for (const s of screenMats) {
    const m = s.mat;
    if (m.color) {
      m.color.setRGB(s.baseColor.r * l, s.baseColor.g * l, s.baseColor.b * l);
    }
    if (typeof m.emissiveIntensity === 'number') {
      m.emissiveIntensity = s.baseEmissiveIntensity * l;
    }
    if (m.emissive && s.baseEmissive) {
      m.emissive.copy(s.baseEmissive);
    }
  }
}

let toastTimer = null;
function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function toggleScreen() {
  litTarget = litTarget > 0.5 ? 0 : 1;
  showToast(litTarget > 0.5 ? '屏幕 已点亮' : '屏幕 已熄灭');
}

function fitCameraToObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const tanHalf = Math.tan(vFov / 2);

  const margin = 1.35;
  const distV = (size.y / 2) / tanHalf;
  const distH = (size.x / 2) / (tanHalf * camera.aspect);
  const dist = Math.max(distV, distH) * margin;

  const dir = new THREE.Vector3(0.55, 0.1, 1).normalize();

  camera.position.copy(center).add(dir.multiplyScalar(dist));
  controls.target.copy(center);
  camera.updateProjectionMatrix();

  controls.minDistance = dist * 0.42;
  controls.maxDistance = dist * 2.4;
  controls.update();
}

/* ---------------------------------------------------------------
   尝试加载外部 GLB（失败就用内置手机，不报错）
   --------------------------------------------------------------- */
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);

const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');

let loadSeq = 0;

function loadExternalGLB(url, sourceLabel) {
  const seq = ++loadSeq;

  if (loadingEl) {
    loadingEl.classList.remove('hidden');
    loadingText.textContent = '正在加载模型…';
  }

  loader.load(
    url,
    (gltf) => {
      if (seq !== loadSeq) return;
      try {
        mountModel(gltf.scene, sourceLabel);
      } catch (err) {
        console.error(err);
        if (window.__showFatal) window.__showFatal('模型处理失败：' + (err && err.message || err));
      } finally {
        if (loadingEl) loadingEl.classList.add('hidden');
      }
    },
    (e) => {
      if (seq !== loadSeq) return;
      if (e.lengthComputable && e.total && loadingText) {
        const p = Math.round((e.loaded / e.total) * 100);
        loadingText.textContent = `正在加载模型… ${p}%`;
      }
    },
    (err) => {
      if (seq !== loadSeq) return;
      console.warn('[手机展示] 外部模型加载失败，继续使用内置演示模型：', err);
      if (loadingEl) loadingEl.classList.add('hidden');
    }
  );
}

/* ---------------------------------------------------------------
   启动：先显示内置手机，再后台尝试加载 model.glb
   --------------------------------------------------------------- */
(function boot() {
  try {
    const phone = buildProceduralPhone();
    mountModel(phone, '内置演示模型');
    if (loadingEl) loadingEl.classList.add('hidden');
  } catch (err) {
    console.error(err);
    if (window.__showFatal) window.__showFatal('内置模型构建失败：' + (err && err.message || err));
    return;
  }

  // 后台尝试加载外部 model.glb（存在则自动替换）
  loadExternalGLB(CONFIG.modelUrl, 'model.glb');
})();

/* ---------------------------------------------------------------
   点击检测
   --------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let pointerDownInfo = null;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownInfo) return;
  const dx = e.clientX - pointerDownInfo.x;
  const dy = e.clientY - pointerDownInfo.y;
  const dt = performance.now() - pointerDownInfo.t;
  pointerDownInfo = null;

  if (Math.hypot(dx, dy) > 10) return;
  if (dt > 700) return;
  if (screenMeshes.length === 0) return;

  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(screenMeshes, false);
  if (hits.length > 0) toggleScreen();
});

/* ---------------------------------------------------------------
   自动旋转暂停/恢复
   --------------------------------------------------------------- */
const hintEl = document.getElementById('hint');
let idleTimer = null;

controls.addEventListener('start', () => {
  controls.autoRotate = false;
  hintEl.style.opacity = '0';
  clearTimeout(idleTimer);
});

controls.addEventListener('end', () => {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    controls.autoRotate = true;
    hintEl.style.opacity = '1';
  }, 3000);
});

/* ---------------------------------------------------------------
   文件上传
   --------------------------------------------------------------- */
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!/\.(glb|gltf)$/i.test(file.name)) {
    alert('请选择 .glb 或 .gltf 文件');
    return;
  }
  const url = URL.createObjectURL(file);
  loadExternalGLB(url, file.name);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  fileInput.value = '';
});

/* ---------------------------------------------------------------
   窗口尺寸（关键：composer 传 CSS 尺寸，避免 RT 被 dpr 二次放大）
   --------------------------------------------------------------- */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  // 同步 composer 的 pixelRatio，再传 CSS 尺寸
  if (typeof composer.setPixelRatio === 'function') {
    composer.setPixelRatio(dpr);
  }
  composer.setSize(w, h);
}

window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------
   动画循环
   --------------------------------------------------------------- */
const clock = new THREE.Clock();
let lastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000 || 0, 0.05);
  lastTime = now;
  const t = clock.getElapsedTime();

  if (Math.abs(lit - litTarget) > 0.0015) {
    const k = 1 - Math.exp(-11 * dt);
    lit += (litTarget - lit) * k;
    applyScreenState(lit);
  } else if (lit !== litTarget) {
    lit = litTarget;
    applyScreenState(lit);
  }

  if (modelPivot) {
    modelPivot.position.y = Math.sin(t * 1.1) * 0.06;
  }

  if (ring1 && ring2) {
    ring1.rotation.z = t * 0.18;
    ring2.rotation.z = -t * 0.12;
    ring1.material.opacity = 0.62 + Math.sin(t * 2.0) * 0.16;
    ring2.material.opacity = 0.34 + Math.sin(t * 1.6 + 1.2) * 0.10;
  }
  if (floorGlow) floorGlow.material.opacity = 0.44 + Math.sin(t * 1.5) * 0.07;
  if (polarGrid) polarGrid.rotation.y = t * 0.05;
  if (particles) particles.rotation.y = t * 0.03;

  controls.update();
  composer.render();
}
requestAnimationFrame(animate);
</script>
